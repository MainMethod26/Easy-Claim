name = "easy-claim-backend"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "easy-claim-db"
database_id = "d533a05e-0001-4bce-b664-65cd32aead50"

[[queues.producers]]
queue = "claim-events"
binding = "CLAIM_EVENTS"

[[queues.consumers]]
queue = "claim-events"
max_batch_size = 10
max_batch_timeout = 5

# Private evidence storage (Phase 2). No public access, no r2.dev subdomain: files are only
# ever served back through the authorized download route in src/endpoints/evidence.ts.
# Deployed environments must first run: wrangler r2 bucket create easy-claim-evidence
[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "easy-claim-evidence"

# Approximate per-client throttling for /api/* (see src/index.ts).
# period must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

[vars]
# No cross-origin browser access unless explicitly listed (comma-separated).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000,https://easy-claim-admin.pages.dev"
# Expected JWT issuer / audience (see src/security/actor.ts). Change per environment.
JWT_ISSUER = "easyclaim-dev"
JWT_AUDIENCE = "easyclaim-api"
# Fail-safe default: the demo login (src/endpoints/demoAuth.ts) and /swagger are OFF unless an
# environment deliberately sets ENVIRONMENT = "development" or "demo" (local: backend/.dev.vars).
ENVIRONMENT = "production"
# JWT_SECRET is a SECRET, never a var: `wrangler secret put JWT_SECRET` (deployed)
# or backend/.dev.vars (local, gitignored). The API refuses every request without it.

# Secrets the Worker needs (values never live in this file).
# Deployed: `wrangler secret put <NAME>`. Local: `npm run setup:local` writes backend/.dev.vars.
#   JWT_SECRET           required. HS256 token secret (>= 32 bytes); missing -> every request 401
#   MLDSA_SEED           required. 32-byte hex seed of the ML-DSA-65 decision-signing key (Phase 5);
#                        missing -> /decide 503, /pay 409
#   DEMO_LOGIN_PASSWORD  optional, local/demo only; missing -> demo login 404
# A [secrets] required = [...] block is deliberately NOT used: with it, wrangler 4.141 loads from
# .dev.vars only the listed names and existing [vars], which would silently drop DEMO_LOGIN_PASSWORD.

# Workers AI for evidence OCR (queue consumer, src/endpoints/ocr.ts). Advisory text only.
# DISABLED in this file on purpose: an [ai] binding is always remote, so with it `wrangler dev` and the
# vitest suite demand a CLOUDFLARE_API_TOKEN and fail for everyone offline. The OCR code skips itself when
# AI is not bound. To enable OCR on a deployed Worker, uncomment the two lines below before `wrangler deploy`
# (or add the Workers AI binding in the dashboard).
# [ai]
# binding = "AI"

# Nightly job: Info Needed -> Expired after 30 days (src/jobs/expireInfoNeeded.ts), audited.
[triggers]
crons = ["0 0 * * *"]
